apply plugin: 'com.android.library'
apply plugin: 'com.android.legacy-kapt'

// For Code coverage
apply plugin: 'jacoco'

android {
    namespace = "com.sotwtm.support"
    compileSdk = rootProject.ext.compile_sdk_version

    defaultConfig {
        minSdk = 26
        targetSdk = rootProject.ext.target_sdk_version
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        debug {
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    /*
    * To enable Android Data Binding Library
    * See, https://developer.android.com/topic/libraries/data-binding/index.html
    * */
    buildFeatures {
        viewBinding = true
        dataBinding = true
        // https://stackoverflow.com/a/74692390
        buildConfig = true
    }

    // Fix build error on including libs that with these files
    packaging {
        resources {
            excludes += ['LICENSE.txt', 'META-INF/DEPENDENCIES', 'META-INF/DEPENDENCIES.txt', 'META-INF/dependencies.txt', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/LGPL2.1', 'META-INF/MANIFEST.MF', 'META-INF/main.kotlin_module']
        }
    }

    compileOptions {
        encoding = "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // continue build even found lint error
    lint {
        abortOnError = false
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
                events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
            }
        }
    }

    defaultConfig {
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
}

dependencies {

    //****** These libs must be listed in the sub projects. Otherwise, it will fail to build ******
    // =============================================================
    // <<<<<<<<<<<<<<<<<<<< MUST ADD LIBS START >>>>>>>>>>>>>>>>>>>>
    // Android support libs
    // https://developer.android.com/jetpack/androidx/releases/core
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"

    // Dagger 2
    implementation "com.google.dagger:dagger:$versions.dagger_2"
    implementation "com.google.dagger:dagger-android:$versions.dagger_2"
    implementation "com.google.dagger:dagger-android-support:$versions.dagger_2"
    kapt "com.google.dagger:dagger-compiler:$versions.dagger_2"
    kapt "com.google.dagger:dagger-android-processor:$versions.dagger_2"

    // AndroidEasyLog
    implementation "com.sotwtm.util:ec-log:$rootProject.ext.versions.android_ec_log"
    // <<<<<<<<<<<<<<<<<<<< MUST ADD LIBS END >>>>>>>>>>>>>>>>>>>>
    // ===========================================================

    /***** For Unit Test *****/
    testImplementation deps.junit
}
